<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="icon" href="./Images/favicon.ico" type="image/x-icon">
    <style>
         body {
            background: url(./Images/cup-coffee-table-front-street-with-city-lights-background.jpg);
            background-size: cover;
            height: 100vh;
            overflow: auto;
            background-position: center;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.815);
            border-radius: 6px;
            margin-top: 50px;
            text-align: center;
        }

        .container h2 {
            margin-top: 20px;
            font-weight: bold;
            color: #333; /* Adjust text color */
        }

        .message {
            font-size: 1.2rem;
            margin-top: 10px;
            line-height: 1.6;
            color: #555; /* Adjust text color */
        }

        .message a {
            color: rgb(228, 81, 28);
            text-decoration: none;
            font-weight: bold;
        }

        .message a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Thank you!</h2>
        <p class="message">Your order has been successfully placed. We have received your payment and will 
            process your order shortly. <br>
            <a href="index.html">Return to Eren's Cafe</a></p>
            
    </div>
</body>
</html>
